<!doctype html>
<html><head><meta charset="utf-8"><title>bench</title>
<script src="x_ite/x_ite.min.js"></script>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}x3d-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head>
<body><x3d-canvas id="c" splashScreen="false" contextMenu="false" notifications="false" timings="false"></x3d-canvas>
<script>
// Load/measure one scene. Result lands in window.__result. Times are CPU wall-clock (performance.now), NOT frame rates.
(async () => {
  const Q = new URLSearchParams(location.search);
  const R = { scene: Q.get('scene'), errors: [] };
  window.__result = null;
  try {
    await customElements.whenDefined('x3d-canvas');
    const canvas = document.getElementById('c'), B = canvas.browser;
    R.xite = B.version;
    if (Q.get('tone')) B.setBrowserOption('ToneMapping', Q.get('tone'));
    if (Q.get('oit')) B.setBrowserOption('OrderIndependentTransparency', Q.get('oit') === '1');
    if (Q.get('msaa')) B.setBrowserOption('Multisampling', +Q.get('msaa'));
    let initT = null;
    B.addBrowserCallback('bench', X3D.X3DConstants.INITIALIZED_EVENT, () => { if (initT === null) initT = performance.now(); });
    const t0 = performance.now();
    const text = await (await fetch(Q.get('scene'))).text();
    const t1 = performance.now();
    const scene = await B.createX3DFromString(text);
    const t2 = performance.now();
    window.__glreset && window.__glreset();
    await B.replaceWorld(scene);
    const t3 = performance.now();
    R.t_fetch_ms = t1 - t0; R.t_parse_build_ms = t2 - t1; R.t_replace_ms = t3 - t2;
    R.t_initialized_cb_ms = initT === null ? null : initT - t2;
    R.t_total_ms = t3 - t0;
    // node count (distinct nodes reachable from root nodes) + type histogram
    const seen = new Set(), hist = {};
    const walk = (n) => {
      if (!n) return;
      let key = null;
      try { key = n.getNodeUserData ? null : null; } catch (e) {}
      const uid = n.getId ? n.getId() : null;
      if (uid !== null) { if (seen.has(uid)) return; seen.add(uid); }
      const tn = n.getNodeTypeName ? n.getNodeTypeName() : n.getTypeName(); hist[tn] = (hist[tn] || 0) + 1;
      for (const f of n.getFieldDefinitions ? [...n.getFieldDefinitions()] : []) {
        const t = f.dataType;
        if (t === X3D.X3DConstants.SFNode) { try { walk(n[f.name]); } catch (e) {} }
        else if (t === X3D.X3DConstants.MFNode) { try { for (const c of n[f.name]) walk(c); } catch (e) {} }
      }
    };
    if (Q.get('count') !== '0') { for (const n of scene.rootNodes) walk(n); R.nodes_distinct = seen.size; R.node_hist = hist; }
    // let a few frames pass, then measure an orbiting-camera window (static scenes are NOT redrawn by X_ITE: 0 draws)
    const raf = () => new Promise(r => requestAnimationFrame(() => r()));
    for (let i = 0; i < 3; i++) await raf();
    R.gl_load = window.__glstats ? window.__glstats() : null;
    window.__glreset && window.__glreset();
    const vp = scene.getNamedNode ? (() => { try { return scene.getNamedNode('VP'); } catch (e) { return null; } })() : null;
    const P = vp ? [...vp.position] : [3, 2, 5], r0 = Math.hypot(P[0], P[2]), ph0 = Math.atan2(P[0], P[2]);
    const look = (p) => { const f = [-p[0], -p[1], -p[2]], n = Math.hypot(...f); const z = f.map(c => -c / n);
      let x = [z[2], 0, -z[0]]; const nx = Math.hypot(...x); x = x.map(c => c / nx);
      const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
      const m = [[x[0], y[0], z[0]], [x[1], y[1], z[1]], [x[2], y[2], z[2]]]; const tr = m[0][0] + m[1][1] + m[2][2];
      const ang = Math.acos(Math.max(-1, Math.min(1, (tr - 1) / 2))); const s = 2 * Math.sin(ang);
      return ang < 1e-9 ? [0, 0, 1, 0] : [(m[2][1] - m[1][2]) / s, (m[0][2] - m[2][0]) / s, (m[1][0] - m[0][1]) / s, ang]; };
    const W = +(Q.get('window') || 4), maxT = W * 1000, minF = +(Q.get('minframes') || 3);
    const ts = performance.now(); let frames = 0; const wall = [];
    while (performance.now() - ts < maxT || frames < minF) {
      if (vp && Q.get('orbit') !== '0') { const a = ph0 + frames * 0.02; const p = [r0 * Math.sin(a), P[1], r0 * Math.cos(a)]; vp.position = p; vp.orientation = look(p); }
      const a0 = performance.now(); await raf(); wall.push(performance.now() - a0); frames++;
      if (performance.now() - ts > 60000) break;
    }
    R.window_frames = frames;
    R.window_s = (performance.now() - ts) / 1000;
    wall.sort((a, b) => a - b);
    R.frame_interval_median_ms = wall[wall.length >> 1];
    R.gl = window.__glstats ? window.__glstats() : null;
    R.vp = canvas.browser.currentScene && canvas.browser.currentScene.rootNodes.length;
  } catch (e) { R.errors.push('EXC ' + (e && e.stack || e)); }
  window.__result = R;
})();
</script></body></html>
