<!doctype html>
<html><head><meta charset="utf-8"><title>shot</title>
<script src="x_ite/x_ite.min.js"></script>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}x3d-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head>
<body><x3d-canvas id="c" splashScreen="false" contextMenu="false" notifications="false" timings="false"></x3d-canvas>
<script>
// Still-frame page for the collider scenes. Query: scene=<url>, vp=<Viewpoint DEF>, t=<seconds into the cycle>, frames=<n>.
// 1. load the scene; 2. stop the one TimeSensor (DEF clock) and write the phase t/cycle into every field it is routed to,
// so a still shows a chosen moment of the animation; 3. bind the chosen Viewpoint and re-assert its pose for a few
// frames (headless X_ITE draws only the Background until a script binds a Viewpoint and moves it); then the page is still.
(async () => {
  const Q = new URLSearchParams(location.search), R = { scene: Q.get('scene'), errors: [] };
  window.__ready = null;
  try {
    await customElements.whenDefined('x3d-canvas');
    const canvas = document.getElementById('c'), B = canvas.browser;
    for (const k of ['ToneMapping', 'OrderIndependentTransparency', 'Multisampling']) {
      const v = Q.get(k); if (v !== null) B.setBrowserOption(k, v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v);
    }
    const t0 = performance.now();
    await B.loadURL(new X3D.MFString(Q.get('scene')));
    R.t_loadURL_ms = performance.now() - t0;
    const scene = B.currentScene;
    const named = n => { try { return scene.getNamedNode(n); } catch (e) { return null; } };
    const raf = () => new Promise(r => requestAnimationFrame(() => r()));
    const clock = named('clock');
    if (clock && Q.get('t') !== null) {
      const cycle = clock.cycleInterval, phase = Math.min(0.9999, Math.max(0, +Q.get('t') / cycle));
      clock.enabled = false;
      await raf();
      R.phase = phase; R.phase_targets = [];
      for (const r of scene.routes) {
        if (r.sourceNode && r.sourceNode.getNodeName && r.sourceNode.getNodeName() === 'clock') {
          r.destinationNode[r.destinationField] = phase;
          R.phase_targets.push(r.destinationNode.getNodeName() + '.' + r.destinationField);
        }
      }
    }
    const vp = named(Q.get('vp') || 'vp_endon');
    const nf = +(Q.get('frames') || 8);
    if (vp) {
      vp.set_bind = true; await raf();
      const P0 = [...vp.position], O0 = [...vp.orientation];
      for (let i = 0; i < nf; i++) { vp.position = new X3D.SFVec3f(P0[0] + (i % 2 ? 1e-6 : 0), P0[1], P0[2]); vp.orientation = new X3D.SFRotation(...O0); await raf(); }
      vp.position = new X3D.SFVec3f(...P0);
      R.viewpoint = vp.getNodeName();
    } else { R.errors.push('no viewpoint ' + Q.get('vp')); for (let i = 0; i < nf; i++) await raf(); }
    await raf(); await raf();
    R.gl = window.__glstats ? window.__glstats() : null;
  } catch (e) { R.errors.push('EXC ' + (e && e.stack || e)); }
  window.__ready = R;
})();
</script></body></html>
