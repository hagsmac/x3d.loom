<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NIB · x3d.platformer</title>
<meta name="description" content="NIB: an original physics platformer whose levels are X3D 4.0 files, drawn by X_ITE and played by a deterministic 120 Hz engine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #2a1d10; --paper: #fff8ec; --gold: #ffc53d; --gold2: #ff9f1c; --cyan: #3fe0ff; --red: #ff4d5e; --glass: rgba(20, 14, 8, 0.42); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1630; color: var(--paper); font-family: Fredoka, ui-rounded, system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
#stage, x3d-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; gap: 10px; align-items: center; pointer-events: none; opacity: 0; transition: opacity .3s; }
body.playing #hud { opacity: 1; }
body.nohud #hud, body.nohud #hint, body.nohud #banner { display: none !important; }
.chip { background: var(--glass); backdrop-filter: blur(6px); border: 2px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 20px; display: flex; gap: 8px; align-items: center; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.chip .ico { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, var(--gold) 45%, var(--gold2)); box-shadow: inset 0 0 0 4px rgba(120,70,0,.35); }
#stars span { color: rgba(255,255,255,.28); font-size: 22px; } #stars span.on, #w-stars span.on { color: var(--gold); text-shadow: 0 0 12px rgba(255,190,40,.9); }
#lvname { margin-left: auto; font-weight: 600; font-size: 15px; opacity: .85; }
#hint { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); max-width: min(640px, calc(100% - 32px)); background: var(--paper); color: var(--ink); border-radius: 18px; padding: 10px 18px; font-weight: 600; font-size: 18px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.25); opacity: 0; transition: .25s; pointer-events: none; }
#hint.show { opacity: 1; transform: translate(-50%, 0); }
body.touch #hint { bottom: 150px; }
#banner { position: fixed; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none; opacity: 0; }
#banner b { display: block; font-size: clamp(40px, 8vw, 84px); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); letter-spacing: 1px; }
#banner i { font-style: normal; font-size: 20px; font-weight: 600; text-shadow: 0 2px 0 var(--ink); }
#banner.show { animation: ban 2.6s ease-out forwards; }
@keyframes ban { 0% { opacity: 0; transform: scale(.6); } 12% { opacity: 1; transform: scale(1.06); } 20% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
.screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; padding: 16px; background: radial-gradient(ellipse at center, rgba(20,10,30,.15), rgba(20,10,30,.6)); }
.screen.show { display: flex; animation: fade .35s; }
@keyframes fade { from { opacity: 0; } }
.logo { font-size: clamp(84px, 18vw, 180px); font-weight: 700; line-height: .9; color: var(--gold); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink), 0 18px 30px rgba(0,0,0,.4); letter-spacing: 4px; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
.tag { font-size: clamp(16px, 3vw, 24px); font-weight: 600; text-shadow: 0 2px 0 var(--ink); text-align: center; }
.btn { pointer-events: auto; font: inherit; font-weight: 700; font-size: 22px; color: var(--ink); background: linear-gradient(#ffe27a, var(--gold) 55%, var(--gold2)); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 28px; box-shadow: 0 6px 0 var(--ink); cursor: pointer; transition: transform .08s; }
.btn:hover { transform: translateY(-2px); } .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn.ghost { background: rgba(255,255,255,.85); font-size: 16px; padding: 8px 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.keys { font-size: 15px; opacity: .9; text-align: center; line-height: 1.6; text-shadow: 0 1px 0 var(--ink); max-width: 640px; }
kbd { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 1px 7px; font-family: inherit; font-weight: 700; box-shadow: 0 2px 0 rgba(0,0,0,.4); }
#cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; width: min(900px, 100%); }
.card { pointer-events: auto; font: inherit; text-align: left; color: var(--ink); border: 3px solid var(--ink); border-radius: 22px; padding: 16px; cursor: pointer; box-shadow: 0 7px 0 var(--ink); display: flex; flex-direction: column; gap: 4px; background: linear-gradient(160deg, #bff0ff, #9fe08a); transition: transform .1s; }
.card[data-theme=gorge] { background: linear-gradient(160deg, #ffd3a1, #ff8f7a); } .card[data-theme=spire] { background: linear-gradient(160deg, #9aa8ff, #6c4bd6); color: #fff; }
.card:hover { transform: translateY(-3px) rotate(-.6deg); }
.card .num { font-weight: 700; font-size: 14px; opacity: .7; } .card b { font-size: 26px; } .card i { font-style: normal; font-size: 14px; opacity: .85; } .card .best { margin-top: 8px; font-size: 13px; font-weight: 600; }
em[data-rank] { font-style: normal; font-weight: 700; padding: 0 6px; border-radius: 6px; background: var(--ink); color: var(--gold); }
.panel { background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 26px; padding: 22px 28px; box-shadow: 0 10px 0 var(--ink); min-width: min(420px, 100%); text-align: center; }
.panel h2 { margin: 0 0 8px; font-size: 40px; }
.stats { display: grid; grid-template-columns: auto auto; gap: 6px 22px; justify-content: center; font-size: 20px; font-weight: 600; margin: 10px 0 16px; text-align: left; }
.stats span:nth-child(odd) { opacity: .7; }
#w-stars span { color: #d8cbb4; font-size: 26px; }
#w-rank { font-size: 92px; font-weight: 700; line-height: 1; color: var(--gold); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); animation: pop .6s cubic-bezier(.2, 1.8, .4, 1); }
#w-rank[data-rank=S] { color: #ff5ad1; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } }
#w-hash, #ver { font-size: 11px; opacity: .6; font-family: ui-monospace, monospace; }
#toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--glass); padding: 6px 14px; border-radius: 12px; opacity: 0; transition: .2s; pointer-events: none; }
#toast.show { opacity: 1; }
#err { position: fixed; bottom: 8px; left: 8px; color: #ffb3b3; font-size: 13px; }
#touch { display: none; }
body.touch.playing #touch { display: block; }
#touch button { position: fixed; bottom: max(22px, env(safe-area-inset-bottom)); width: 78px; height: 78px; border-radius: 50%; border: 3px solid rgba(255,255,255,.6); background: rgba(20,14,8,.35); color: #fff; font: 700 26px Fredoka, sans-serif; pointer-events: auto; touch-action: none; }
#touch button.on { background: rgba(255,197,61,.7); color: var(--ink); }
#touch [data-b=L] { left: 18px; } #touch [data-b=R] { left: 108px; }
#touch [data-b=J] { right: 18px; width: 96px; height: 96px; } #touch [data-b=A] { right: 128px; } #touch [data-b=D] { right: 70px; bottom: 132px; width: 64px; height: 64px; font-size: 20px; }
#pausebtn { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 16px; display: none; }
body.touch.playing #pausebtn { display: block; }
@media (max-width: 560px) { .chip { font-size: 16px; padding: 4px 10px; } #lvname { display: none; } }
</style>
<script src="vendor/x_ite/x_ite.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/x_ite@16.5.1/dist/x_ite.min.js';document.head.appendChild(s)"></script>
</head>
<body data-theme="meadow">
<div id="stage"><x3d-canvas id="canvas" splashScreen="false" contextMenu="false" notifications="false" timings="false" antialiased="true" contentScale="auto"></x3d-canvas></div>

<div id="hud">
  <div class="chip"><span class="ico"></span><span id="cogs">0/0</span></div>
  <div class="chip" id="stars"></div>
  <div class="chip">⏱ <span id="time">0:00.0</span></div>
  <div class="chip">✖ <span id="deaths">0</span></div>
  <div id="lvname"></div>
</div>
<div id="hint"></div>
<div id="banner"><b></b><i></i></div>
<div id="toast"></div>

<section id="title" class="screen">
  <div class="logo">NIB</div>
  <div class="tag">a physics platformer where every level is an X3D file</div>
  <button class="btn" id="start">PLAY</button>
  <div class="keys"><kbd>←</kbd><kbd>→</kbd> run · <kbd>Space</kbd> jump · <kbd>↓</kbd> in the air: ground pound · hold <kbd>Shift</kbd> near a ring: grapple, <kbd>↑</kbd><kbd>↓</kbd> reel · <kbd>R</kbd> restart · <kbd>Esc</kbd> pause · <kbd>M</kbd> sound · gamepad works too</div>
  <div id="ver"></div>
</section>

<section id="select" class="screen">
  <div class="tag" style="font-size:34px">Choose a world</div>
  <div id="cards"></div>
  <div class="row"><button class="btn ghost" id="back">Back</button><button class="btn ghost" id="lite">Lite graphics</button></div>
</section>

<section id="pause" class="screen">
  <div class="panel"><h2>Paused</h2>
    <div class="row"><button class="btn" id="resume">Resume</button><button class="btn ghost" id="p-restart">Restart</button><button class="btn ghost" id="p-menu">Worlds</button></div>
  </div>
</section>

<section id="win" class="screen">
  <div class="panel">
    <h2>Gate reached!</h2>
    <div id="w-rank">S</div>
    <div class="stats"><span>Time</span><span id="w-time"></span><span>Cogs</span><span id="w-cogs"></span><span>Golden gears</span><span id="w-stars"></span><span>Tumbles</span><span id="w-deaths"></span></div>
    <div class="row"><button class="btn" id="w-next">Next world</button><button class="btn ghost" id="w-retry">Retry</button><button class="btn ghost" id="w-menu">Worlds</button><button class="btn ghost" id="w-save">Save replay</button></div>
    <div id="w-hash"></div>
  </div>
</section>

<div id="touch">
  <button data-b="L">◀</button><button data-b="R">▶</button>
  <button data-b="A">⚓</button><button data-b="D">▼</button><button data-b="J">▲</button>
</div>
<button class="btn ghost" id="pausebtn" onclick="dispatchEvent(new KeyboardEvent('keydown',{code:'Escape'}))">II</button>
<div id="err"></div>
<script type="module" src="main.js"></script>
</body>
</html>
